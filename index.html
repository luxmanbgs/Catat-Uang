<style>
:root{--a:#4f7cff;--b:#9b5cff;--g:linear-gradient(135deg,#4f7cff,#9b5cff);--t:#1b1f3b;--m:#7a809e;--in:#12b886;--ex:#f0587a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--t);background:radial-gradient(circle at 8% -4%,#dfe7ff,transparent 45%),radial-gradient(circle at 100% 14%,#efe0ff,transparent 40%),#fff;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(110px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:0 8px 28px rgba(79,124,255,.1);border-radius:20px;padding:16px;margin:12px 0;animation:up .35s both}
.hero{background:var(--g);color:#fff;border:0}.hero small{opacity:.85}.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:6px 0}
.ib{border:0;background:rgba(255,255,255,.8);border-radius:12px;width:40px;height:40px;font-size:18px;margin-left:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:1px solid #e4e8fb;background:#fff;border-radius:999px;padding:10px 14px;font:inherit;color:var(--t)}
.ch.on{background:var(--g);color:#fff;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.grid2>div{background:rgba(255,255,255,.2);border-radius:14px;padding:10px}
input,select{width:100%;font:inherit;color:var(--t);padding:13px;border:1px solid #e4e8fb;border-radius:14px;background:#fff;margin:6px 0}
.mu{color:var(--m);font-size:13px}.r{text-align:right}.in{color:var(--in)}.ex{color:var(--ex)}
.br{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.br span:first-child{width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:10px;background:#eef1fd;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.tr{display:flex;align-items:flex-end;gap:2px;height:90px}.tr i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef1fd}.it:last-child{border:0}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:600 16px inherit;color:#fff;background:var(--g);box-shadow:0 8px 20px rgba(111,92,255,.3);margin-top:10px}.btn.d{background:#fff;color:var(--ex);box-shadow:none;border:1px solid #f5c2cf}.btn:disabled{opacity:.6}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;height:64px;background:rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;border-radius:24px;box-shadow:0 10px 30px rgba(79,124,255,.18);z-index:5}
nav button{border:0;background:none;font:12px inherit;color:var(--m);flex:1;height:100%}nav button.on{color:var(--a);font-weight:700}
nav .fab{flex:none;width:64px;height:64px;margin-top:-26px;border-radius:50%;background:var(--g);color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(111,92,255,.45)}
.ov{position:fixed;inset:0;background:rgba(27,31,59,.35);z-index:9;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@keyframes sl{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef1fd;border-radius:14px;padding:4px}.seg button{border:0;background:none;padding:12px;border-radius:11px;font:600 15px inherit;color:var(--m)}.seg .on{background:#fff;color:var(--t);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.amt{font-size:30px!important;font-weight:700;text-align:center}.wr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:16px;right:16px;padding:14px;border-radius:14px;color:#fff;z-index:20;text-align:center;font-weight:600;animation:up .3s}.toast.ok{background:var(--in)}.toast.er{background:var(--ex)}
.sk{height:110px;border-radius:20px;margin:12px 0;background:linear-gradient(90deg,#f0f2fc 25%,#fafbff 50%,#f0f2fc 75%);background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}
.em{text-align:center;padding:30px 10px;color:var(--m)}.em b{display:block;font-size:40px}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}.tbl td,.tbl th{padding:7px 6px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:var(--m);font-weight:600}
.bd{font-size:11px;padding:2px 8px;border-radius:9px;color:#fff}.bd.g{background:var(--in)}.bd.w{background:#f59f00}.bd.r{background:var(--ex)}
.dh{display:flex;justify-content:space-between;margin:14px 0 2px;font-size:12px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.4px}.dh:first-child{margin-top:0}
.trs{overflow-x:auto;margin-top:8px}.tr2{display:flex;align-items:flex-end;gap:4px;height:130px;width:max-content;min-width:100%}.tb{width:26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.tb i{width:100%;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}.tb small{font-size:9px;color:var(--m);margin-top:3px;white-space:nowrap}
.btn.c{background:#fff;color:var(--m);box-shadow:none;border:1px solid #e4e8fb}nav button{font-size:11px}
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}body{position:relative;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
input,select{font-size:16px;max-width:100%;min-width:0}input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:50px}
.grid2>*,.card,.it>div:first-child{min-width:0}.it>div:first-child{overflow-wrap:anywhere}.dh{gap:8px}.card{max-width:100%}
nav .fab{display:none}nav button{min-width:0}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 24px rgba(111,92,255,.45);z-index:6;transition:transform .15s}.fab:active{transform:scale(.92)}
body[data-v=set] .fab{display:none}
.ov.n .sheet{animation:sl .3s}.gr{width:42px;height:5px;border-radius:9px;background:#d9dcf0;margin:0 auto 14px}
body.lock{position:fixed;left:0;right:0;overflow:hidden}
.fab{display:flex;align-items:center;justify-content:center;padding:0}
header h1{font-size:26px;letter-spacing:-.8px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
body[data-v=login] nav,body[data-v=login] .fab,body[data-v=login] header{display:none}
.lg{min-height:88vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:4vh}
.lm{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--g);display:grid;place-items:center;box-shadow:0 16px 36px rgba(111,92,255,.4);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-7px)}}
.lg h2{font-size:42px;letter-spacing:-1.5px;margin:0;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;margin:0 auto}
.tg{color:var(--m);margin:8px 0 26px;font-size:16px}.gl{text-align:left;padding:20px}.gl label{font-size:12px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.5px}.gl .btn{margin-top:16px}
</style></head><body>
<header><h1>Arta</h1><div><button class=ib onclick="load()" title="Muat ulang">⟳</button><button class=ib onclick="out()" title="Putuskan koneksi">⏻</button></div></header>
<main id=main></main>
<nav><button id=n1 onclick="go('home')">◉<br>Beranda</button><button id=n2 onclick="go('hist')">☰<br>Riwayat</button><button id=n3 onclick="go('set')">⚙<br>Pengaturan</button></nav><button class="fab" onclick="openForm()" aria-label="Tambah Transaksi"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
let D,cfg=JSON.parse(localStorage.cfg||'null'),F={m:'gaji',pi:0,from:'',to:''},H={q:'',c:'',f:'',t:''},V='home',f=null,busy=0;
const today=()=>new Date().toLocaleDateString('en-CA'),addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')},dd=s=>new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',timeZone:'UTC'});
const cs=()=>{try{localStorage.d=JSON.stringify(D)}catch(e){}};
async function api(a,p={}){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:cfg.key,a,...p})}),j=await r.json();if(!j.ok)throw new Error(j.error);return j}
function toast(m,ok=1){const t=document.createElement('div');t.className='toast '+(ok?'ok':'er');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
function prep(){D.tb=D.exp.filter(x=>x[1]==='Tabungan').map(x=>x[0]);D.rf=D.inc.filter(x=>x[1]==='Pengembalian Dana').map(x=>x[0]);if(!F.set){F.set=1;F.pi=Math.max(0,D.per.reduce((k,p,i)=>p[0]<=today()?i:k,0))}}
function range(){const t=today();if(F.m==='hari')return[t,t];
 if(F.m==='minggu'){const s=addD(t,-((new Date(t+'T00:00').getDay()+6)%7));return[s,addD(s,6)]}
 if(F.m==='bulan')return[t.slice(0,8)+'01',new Date(+t.slice(0,4),+t.slice(5,7),0).toLocaleDateString('en-CA')];
 if(F.m==='custom'){const a=F.from||t,b=F.to||a;return[a,b<a?a:b]}
 const p=D.per[F.pi]||[t,t];return[p[0],p[1]]}
function agg(a,b){const r={inc:0,ex:0,sv:0,fs:0,cat:{},day:{},met:{}};D.tx.forEach(t=>{if(t.date<a||t.date>b)return;if(t.type==='Pemasukan'){if(!D.rf.includes(t.cat))r.inc+=t.amt;return}
 if(D.tb.includes(t.cat)){r.sv+=t.amt;return}
 if(t.sav){r.fs+=t.amt;return}
 r.ex+=t.amt;r.cat[t.cat]=(r.cat[t.cat]||0)+t.amt;r.day[t.date]=(r.day[t.date]||0)+t.amt;const m=t.method||'Tanpa metode';r.met[m]=(r.met[m]||0)+t.amt});
 r.sisa=r.inc-r.ex-r.sv;r.sr=r.inc?r.sv/r.inc:0;return r}
const k=n=>{const a=Math.abs(n);return(n<0?'−':'')+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+'jt':Math.round(a/1e3)+'rb')},pc=x=>(x*100).toFixed(1).replace('.',',')+'%',dp=(n,p)=>p?(n>=p?'▲ ':'▼ ')+Math.abs(Math.round((n-p)/Math.abs(p)*100))+'%':'–',dh=(n,p,bad)=>p?`<b class="${(n>=p)===!bad?'in':'ex'}">${dp(n,p)}</b>`:'<span class=mu>–</span>',lb=s=>new Date(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
function prevR(){const[a,b]=range();if(F.m==='gaji'&&F.pi>0){const p=D.per[F.pi-1];return[p[0],p[1],p[2]]}const n=(new Date(b)-new Date(a))/864e5+1;return[addD(a,-n),addD(a,-1),'periode sebelumnya']}
function sal(a,b){return D.sv.map(g=>{const q=(D.kal||[]).filter(x=>x[2]===g).sort((x,y)=>x[1]<y[1]?1:-1)[0],d0=q?q[1]:'0000';let s=q?+q[3]:0,i=0,u=0;D.tx.forEach(t=>{const de=t.type==='Pengeluaran'&&t.cat===g?t.amt:0,us=t.sav===g?t.amt:0;if(t.date>d0)s+=de-us;if(t.date>=a&&t.date<=b){i+=de;u+=us}});return{g,s,i,u}})}
function filters(){const c=[['gaji','Periode Gaji'],['hari','Hari ini'],['minggu','Minggu ini'],['bulan','Bulan ini'],['custom','Custom']];
 return`<div class=chips>${c.map(x=>`<button class="ch ${F.m===x[0]?'on':''}" onclick="F.m='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`+
 (F.m==='gaji'?`<select onchange="F.pi=+this.value;render()">${D.per.map((p,i)=>`<option value=${i} ${i===F.pi?'selected':''}>${esc(p[2])} (${dd(p[0])} – ${p[1]>'2090'?'berjalan':dd(p[1])})</option>`).join('')}</select>`:'')+
 (F.m==='custom'?`<div class=grid2 style="margin:0"><input type=date value="${F.from}" onchange="F.from=this.value;render()"><input type=date value="${F.to}" onchange="F.to=this.value;render()"></div>`:'')}
function home(){const[a,b]=range(),r=agg(a,b),[pa,pb,pl]=prevR(),p=agg(pa,pb),n=(new Date(b)-new Date(a))/864e5+1,e=b<today()?b:today(),el=Math.max(1,(new Date(e)-new Date(a))/864e5+1);
 if(!r.inc&&!r.ex&&!r.sv)return`<div class="card em"><b>🗂️</b>Belum ada transaksi di periode ini.<br>Ketuk tombol + untuk mencatat.</div>`;
 const cs=D.exp.filter(x=>!D.tb.includes(x[0])).map(x=>({n:x[0],bd:+x[2]||0,rl:r.cat[x[0]]||0,pv:p.cat[x[0]]||0})).filter(c=>c.bd||c.rl||c.pv),
 big=[...cs].sort((x,y)=>y.rl-x.rl)[0],up=[...cs].sort((x,y)=>(y.rl-y.pv)-(x.rl-x.pv))[0],ov=cs.filter(c=>c.bd&&c.rl>c.bd).sort((x,y)=>(y.rl-y.bd)-(x.rl-x.bd))[0];
 const tr={};Object.entries(r.day).forEach(([d,v])=>{const m=n>62?d.slice(0,7):d;tr[m]=(tr[m]||0)+v});let tk=[];if(n<=62){for(let d=a;d<=e&&tk.length<62;d=addD(d,1))tk.push(d)}else tk=Object.keys(tr).sort();
 const tm=Math.max(1,...tk.map(x=>tr[x]||0)),bl=x=>n>62?x.slice(5):(x===a||x.slice(8)==='01'?dd(x):+x.slice(8));
 const pr=D.per.slice(Math.max(0,F.pi-5),F.pi+1).map(q=>{const x=agg(q[0],q[1]);return`<tr><td>${esc(q[2].slice(0,3)+' '+q[2].slice(-2))}</td><td>${k(x.inc)}</td><td>${k(x.ex)}</td><td>${k(x.sv)}</td><td class="${x.sisa<0?'ex':''}">${k(x.sisa)}</td><td>${pc(x.sr)}</td></tr>`}).join('');
 const mt=Object.entries(r.met).sort((x,y)=>y[1]-x[1]),t10=D.tx.filter(t=>t.type==='Pengeluaran'&&!t.sav&&!D.tb.includes(t.cat)&&t.date>=a&&t.date<=b).sort((x,y)=>y.amt-x.amt).slice(0,10),sl=sal(a,b);
 const cmp=[['Pendapatan',r.inc,p.inc,0],['Konsumsi',r.ex,p.ex,1],['Tabungan',r.sv,p.sv,0],['Sisa',r.sisa,p.sisa,0]];
 return`<div class="card hero"><small>Sisa (pendapatan − konsumsi − tabungan)</small><div class=big>${rp(r.sisa)}</div><div class=grid2><div><small>Pendapatan Baru</small><br><b>${rp(r.inc)}</b><br><small>${dp(r.inc,p.inc)}</small></div><div><small>Konsumsi</small><br><b>${rp(r.ex)}</b><br><small>${dp(r.ex,p.ex)}</small></div><div><small>Alokasi Tabungan</small><br><b>${rp(r.sv)}</b><br><small>${dp(r.sv,p.sv)}</small></div><div><small>Saving Rate</small><br><b>${pc(r.sr)}</b><br><small>${p.inc?((r.sr-p.sr)*100>=0?'▲ ':'▼ ')+Math.abs((r.sr-p.sr)*100).toFixed(1).replace('.',',')+' pt':'–'}</small></div></div></div>
<div class=card><b>Perbandingan dengan ${esc(pl)}</b><div class=mu>${dd(pa)} – ${dd(pb)}</div><div class=tbl><table><tr><th></th><th>Sekarang</th><th>Sebelumnya</th><th>Δ</th></tr>${cmp.map(c=>`<tr><td>${c[0]}</td><td>${k(c[1])}</td><td>${k(c[2])}</td><td>${dh(c[1],c[2],c[3])}</td></tr>`).join('')}<tr><td>Saving rate</td><td>${pc(r.sr)}</td><td>${pc(p.sr)}</td><td>${dh(r.sr,p.sr,0)}</td></tr></table></div></div>
<div class=card><b>Insight</b><div class=it><span>Rata-rata konsumsi/hari</span><b>${rp(r.ex/el)}</b></div><div class=it><span>Pos terbesar</span><b>${big&&big.rl?esc(big.n)+' · '+rp(big.rl):'–'}</b></div><div class=it><span>Kenaikan terbesar</span><b>${up&&up.rl>up.pv?esc(up.n)+' +'+rp(up.rl-up.pv):'–'}</b></div><div class=it><span>Kelebihan anggaran terbesar</span><b class=ex>${ov?esc(ov.n)+' +'+rp(ov.rl-ov.bd):'Tidak ada'}</b></div><div class=it><span>Konsumsi dibiayai tabungan</span><b>${rp(r.fs)}</b></div></div>
<div class=card><b>Anggaran vs realisasi</b>${cs.map(c=>{const u=c.bd?c.rl/c.bd:c.rl?9:0,s=u>1?['r','Melebihi']:u>=.8?['w','Mendekati batas']:['g','Aman'];return`<div style="margin:12px 0"><div class=br style="margin:0"><b style="flex:1">${esc(c.n)}</b><span class="bd ${s[0]}">${s[1]}</span></div><div class=bar style="margin:6px 0"><i style="width:${Math.min(100,u*100)}%;background:${s[0]==='g'?'var(--g)':s[0]==='w'?'#f59f00':'var(--ex)'}"></i></div><div class=mu>${rp(c.rl)} / ${rp(c.bd)} · lalu ${rp(c.pv)} ${dh(c.rl,c.pv,1)}</div></div>`}).join('')}</div>
<div class=card><b>Tren harian</b><div class=mu>Ketuk batang untuk melihat nominal</div><div class=trs><div class=tr2>${tk.map(x=>`<div class=tb onclick="toast('${n>62?x:lb(x)}: ${rp(tr[x]||0)}')"><i style="height:${(tr[x]||0)/tm*100}%"></i><small>${bl(x)}</small></div>`).join('')}</div></div></div>
<div class=card><b>Tren 6 periode</b><div class=tbl><table><tr><th>Periode</th><th>Pendapatan</th><th>Konsumsi</th><th>Tabungan</th><th>Sisa</th><th>SR</th></tr>${pr}</table></div></div>
<div class=card><b>Saldo tabungan per tujuan</b>${sl.map(x=>`<div class=it><div><b>${esc(x.g)}</b><div class=mu>Setoran ${rp(x.i)} · Dipakai ${rp(x.u)}</div></div><b>${rp(x.s)}</b></div>`).join('')||'<p class=mu>Belum ada tujuan tabungan.</p>'}</div>
<div class=card><b>Pengeluaran per metode bayar</b>${mt.map(([m,v])=>`<div class=br><span>${esc(m)}</span><div class=bar><i style="width:${v/r.ex*100}%"></i></div><span class=r style="width:92px">${rp(v)}</span></div>`).join('')}</div>
<div class=card><b>10 pengeluaran terbesar</b>${t10.map(t=>`<div class=it onclick="openForm('${t.id}')"><div><b>${esc(t.desc)}</b><div class=mu>${dd(t.date)} · ${esc(t.cat)}${t.method?' · '+esc(t.method):''}</div></div><b class=ex>${rp(t.amt)}</b></div>`).join('')}</div>`}
function hist(){const cats=[...new Set([...D.exp,...D.inc].map(x=>x[0]))];
 return`<input placeholder="🔍 Cari deskripsi / catatan" value="${esc(H.q)}" oninput="H.q=this.value;hl()"><select onchange="H.c=this.value;hl()"><option value="">Semua kategori</option>${cats.map(c=>`<option ${H.c===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class=grid2 style="margin:0"><input type=date value="${H.f}" onchange="H.f=this.value;hl()"><input type=date value="${H.t}" onchange="H.t=this.value;hl()"></div><div class=card id=hl></div>`}
function hl(){const q=H.q.toLowerCase(),L=D.tx.filter(t=>(!q||(t.desc+' '+t.note+' '+t.cat).toLowerCase().includes(q))&&(!H.c||t.cat===H.c)&&(!H.f||t.date>=H.f)&&(!H.t||t.date<=H.t)).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0).slice(0,150),g={};L.forEach(t=>(g[t.date||'-']=g[t.date||'-']||[]).push(t));
 $('#hl').innerHTML=L.length?Object.keys(g).sort().reverse().map(d=>`<div class=dh><span>${d==='-'?'Tanpa tanggal':lb(d)}</span><span>${rp(g[d].filter(t=>t.type==='Pengeluaran'&&!t.sav).reduce((s,t)=>s+t.amt,0))}</span></div>`+g[d].map(t=>`<div class=it onclick="openForm('${t.id}')"><div><b>${esc(t.desc)}</b><div class=mu>${esc(t.cat)}${t.method?' · '+esc(t.method):''}</div></div><b class="${t.type==='Pemasukan'?'in':'ex'}">${t.type==='Pemasukan'?'+':'−'}${rp(t.amt)}</b></div>`).join('')).join(''):'<div class=em><b>🔎</b>Tidak ada transaksi yang cocok.</div>'}
const fmt=e=>{e.value=e.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
function sett(){const gs=[...new Set(D.exp.map(x=>x[1]))];return`<div class=card><b>Anggaran per periode</b><p class=mu>Nominal ini dipakai di bagian Anggaran vs realisasi. Menyimpan akan mengubah kolom Anggaran Default di sheet Pengaturan, jadi Dashboard Excel ikut berubah.</p>${gs.map(g=>`<div class=dh><span>${esc(g||'Lainnya')}${g==='Tabungan'?' (target alokasi)':''}</span><span>${rp(D.exp.filter(x=>x[1]===g).reduce((s,x)=>s+(+x[2]||0),0))}</span></div>`+D.exp.filter(x=>x[1]===g).map(x=>`<div class=br style="margin:8px 0"><b style="flex:1;font-weight:500">${esc(x[0])}</b><input class=bi data-n="${esc(x[0])}" inputmode=numeric style="width:140px;margin:0;text-align:right" value="${(+x[2]||0).toLocaleString('id-ID')}" onfocus="this.select()" oninput="fmt(this)"></div>`).join('')).join('')}<button class=btn id=sbb onclick="saveBud()">Simpan Anggaran</button></div>`}
async function saveBud(){const it=[];document.querySelectorAll('.bi').forEach(e=>{const v=+e.value.replace(/\D/g,'')||0,r=D.exp.find(x=>x[0]===e.dataset.n);if(r&&(+r[2]||0)!==v)it.push([r[0],v])});
 if(!it.length)return toast('Belum ada perubahan',0);const b=$('#sbb');b.disabled=1;b.textContent='Menyimpan…';
 try{await api('bud',{items:it});it.forEach(([n,v])=>{D.exp.find(x=>x[0]===n)[2]=v});cs();render();toast('Anggaran tersimpan ✓')}catch(x){b.disabled=0;b.textContent='Simpan Anggaran';toast('Gagal menyimpan: '+x.message,0)}}
function render(){const m=$('#main');document.body.dataset.v=cfg?V:'login';$('#n1').className=V==='home'?'on':'';$('#n2').className=V==='hist'?'on':'';$('#n3').className=V==='set'?'on':'';
 if(!cfg)return setup();if(!D){m.innerHTML='<div class=sk></div><div class=sk></div><div class=sk></div>';return}
 m.innerHTML=V==='home'?filters()+home():V==='hist'?hist():sett();if(V==='hist')hl();document.querySelectorAll('.trs').forEach(e=>e.scrollLeft=e.scrollWidth)}
function go(v){V=v;render();scrollTo(0,0)}
function setup(){$('#main').innerHTML=`<div class=lg><div class=lm><svg viewBox="0 0 24 24" width=36 height=36 fill=none stroke=#fff stroke-width=2.2 stroke-linecap=round stroke-linejoin=round><path d="M4 17l5-6 4 4 7-9"/><path d="M15 6h5v5"/></svg></div><h2>Arta</h2><p class=tg>Catat dalam hitungan detik.<br>Pantau arus uangmu di mana saja.</p><div class="card gl"><label>Tautan server</label><input id=su placeholder="https://script.google.com/…/exec" autocapitalize=off autocorrect=off spellcheck=false inputmode=url><label>Kunci akses</label><input id=sk type=password placeholder="Kunci rahasia kamu"><button class=btn onclick="conn()">Masuk</button><p class=mu style="text-align:center;margin:14px 0 0">🔒 Tersimpan hanya di perangkat ini</p></div></div>`}
async function conn(){cfg={url:$('#su').value.trim(),key:$('#sk').value.trim()};try{D=await api('init');localStorage.cfg=JSON.stringify(cfg);prep();cs();render();toast('Selamat datang 👋')}catch(x){cfg=null;D=null;toast('Gagal masuk: '+x.message,0)}}
async function load(){if(!cfg)return;try{D=await api('init');prep();cs();render()}catch(x){toast('Gagal memuat: '+x.message,0);if(!D)$('#main').innerHTML='<div class="card em"><b>📡</b>Tidak bisa terhubung.<br><button class=btn onclick="load()">Coba lagi</button></div>'}}
function out(){if(confirm('Putuskan koneksi di HP ini? (Data di spreadsheet tidak terhapus)')){localStorage.clear();location.reload()}}
function sync(){if(!$('#fa'))return;f.amt=+$('#fa').value.replace(/\D/g,'')||0;f.desc=$('#fd').value;f.date=$('#fdt').value;f.note=$('#fn').value;if($('#fs'))f.sav=$('#fs').value;if($('#fc'))f.cat=$('#fc').value}
function pick(k,v){sync();f[k]=v;if(k==='type'){f.cat='';f.sav=''}rf()}
let sy=0;const lockB=()=>{if(document.body.classList.contains('lock'))return;sy=scrollY;document.body.classList.add('lock');document.body.style.top=-sy+'px'},unlockB=()=>{if(!document.body.classList.contains('lock'))return;document.body.classList.remove('lock');document.body.style.top='';scrollTo(0,sy)};
function openForm(id){f=id?{...D.tx.find(t=>t.id===id)}:{type:'Pengeluaran',amt:0,cat:'',desc:'',date:today(),method:localStorage.lm||D.met[0]||'',note:'',sav:''};lockB();rf(!id)}
function rf(foc){sync();const fr={};D.tx.forEach(t=>fr[t.cat]=(fr[t.cat]||0)+1);const L=(f.type==='Pemasukan'?D.inc:D.exp).map(x=>x[0]).sort((x,y)=>(fr[y]||0)-(fr[x]||0)),ds=[...new Set(D.tx.filter(t=>t.cat===f.cat).map(t=>t.desc))].slice(-40);
 let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';o.className='ov n';o.onclick=e=>{if(e.target===o)closeForm()};document.body.append(o);setTimeout(()=>o.classList.remove('n'),400);let ty=0,dy=0,dg=0;
  o.addEventListener('touchstart',e=>{const s=o.firstElementChild;dg=s&&s.scrollTop<=0?1:0;ty=e.touches[0].clientY;dy=0},{passive:true});
  o.addEventListener('touchmove',e=>{const s=o.firstElementChild;if(!dg||!s)return;dy=e.touches[0].clientY-ty;if(dy>0){s.style.transition='none';s.style.transform=`translateY(${dy}px)`;e.preventDefault()}else dy=0},{passive:false});
  o.addEventListener('touchend',()=>{const s=o.firstElementChild;if(!s||!dg)return;dg=0;s.style.transition='transform .25s';if(dy>110){s.style.transform='translateY(100%)';setTimeout(closeForm,220)}else s.style.transform=''})}
 const A=f.type==='Pemasukan'?D.inc:D.exp,op=n=>`<option ${f.cat===n?'selected':''}>${esc(n)}</option>`;const ch=(k,v)=>`<button class="ch ${f[k]===v?'on':''}" onclick="pick('${k}',this.dataset.v)" data-v="${esc(v)}">${esc(v)}</button>`;
 o.innerHTML=`<div class=sheet><div class=gr></div><div class=seg>${['Pengeluaran','Pemasukan'].map(x=>`<button class="${f.type===x?'on':''}" onclick="pick('type','${x}')">${x}</button>`).join('')}</div>
<input id=fa class=amt inputmode=numeric placeholder="Rp 0" value="${f.amt?f.amt.toLocaleString('id-ID'):''}" oninput="this.value=this.value.replace(/\\D/g,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.')">
<select id=fc onchange="pick('cat',this.value)"><option value="">Pilih kategori…</option><optgroup label="Sering dipakai">${L.slice(0,4).map(op).join('')}</optgroup>${[...new Set(A.map(x=>x[1]))].map(g=>`<optgroup label="${esc(g||'Lainnya')}">${A.filter(x=>x[1]===g).map(x=>op(x[0])).join('')}</optgroup>`).join('')}</select>
<input id=fd list=dl placeholder="Deskripsi (wajib)" value="${esc(f.desc)}"><datalist id=dl>${ds.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
<div class=wr>${D.met.map(c=>ch('method',c)).join('')}</div>
<input id=fdt type=date value="${f.date}"><input id=fn placeholder="Catatan (opsional)" value="${esc(f.note)}">
${f.type==='Pengeluaran'&&D.sv.length?`<select id=fs><option value="">Dibayar dari tabungan? (tidak)</option>${D.sv.map(s=>`<option ${f.sav===s?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}
<button class=btn id=sb onclick="save()">${f.id?'Simpan Perubahan':'Simpan'}</button><button class="btn c" onclick="closeForm()">Batal</button>${f.id?'<button class="btn d" onclick="del()">Hapus Transaksi</button>':''}</div>`;
 if(foc)$('#fa').focus()}
function closeForm(){$('#ov')?.remove();unlockB()}
async function save(){sync();const e=!(f.amt>0)?'Nominal harus lebih dari 0':!f.cat?'Pilih kategori':!f.desc.trim()?'Deskripsi wajib diisi':!f.date?'Tanggal wajib diisi':'';if(e)return toast(e,0);
 const b=$('#sb');b.disabled=1;b.textContent='Menyimpan…';
 try{if(f.id){await api('upd',{id:f.id,t:f});D.tx=D.tx.map(t=>t.id===f.id?{...f}:t)}else{const j=await api('add',{t:f});D.tx.push({...f,id:j.id});localStorage.lm=f.method}
  cs();closeForm();render();toast('Tersimpan ke spreadsheet ✓')}catch(x){b.disabled=0;b.textContent='Coba simpan lagi';toast('Gagal menyimpan: '+x.message,0)}}
async function del(){if(!confirm(`Hapus "${f.desc}" (${rp(f.amt)})?\nTindakan ini tidak bisa dibatalkan.`))return;
 try{await api('del',{id:f.id});D.tx=D.tx.filter(t=>t.id!==f.id);cs();closeForm();render();toast('Transaksi dihapus ✓')}catch(x){toast('Gagal menghapus: '+x.message,0)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
if(localStorage.d){try{D=JSON.parse(localStorage.d);prep()}catch(e){}}
render();load();
</script></body></html>
